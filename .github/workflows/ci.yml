name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev,faiss,fulltext]"
      - run: ruff check src tests
      - run: pytest --cov=evidentia --cov-report=term-missing --cov-fail-under=85

  cross-platform-determinism:
    # The reproducibility claim is only credible if CI enforces it across
    # operating systems and interpreter versions, not just on one machine.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python scripts/determinism_check.py --expect 093b73863e8f24af
