# Standalone GROBID, for using Evidentia without a full LitRev deployment.
#
#     docker compose -f docker/docker-compose.grobid.yml up -d
#     evidentia ingest-pdf data/pdf --out corpus.jsonl
#
# The CRF image is ~350 MB and runs anywhere including Apple Silicon. The
# full deep-learning image (grobid/grobid) segments references better but is
# several GB and wants a GPU; for IMRaD section recovery, which is what this
# pipeline needs, the CRF image is sufficient.

services:
  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: evidentia_grobid
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      JAVA_OPTS: "-Xmx4g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
