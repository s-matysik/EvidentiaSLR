[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidentiaslr"
version = "1.0.0"
description = "Reproducible retrieval for literature analysis: measuring and certifying the effect of vector-index choice on evidence sets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Matysik", email = "sebastian.matysik@usz.edu.pl" },
]
keywords = [
    "systematic review",
    "retrieval augmented generation",
    "vector database",
    "reproducibility",
    "information retrieval",
    "PRISMA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
sbert = ["sentence-transformers>=2.2", "torch>=2.0"]
nli = ["transformers>=4.35", "torch>=2.0"]
qdrant = ["qdrant-client>=1.7"]
pgvector = ["psycopg[binary]>=3.1"]
chroma = ["chromadb>=0.4"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "pydantic>=2.0"]
fulltext = ["httpx>=0.27", "pypdf>=4.0"]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "hypothesis>=6.100",   # property-based tests for the determinism invariants
    "fastapi>=0.110",      # service tests run in-process via TestClient
    "httpx>=0.27",
]
all = [
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2",
    "transformers>=4.35",
    "torch>=2.0",
    "qdrant-client>=1.7",
    "psycopg[binary]>=3.1",
    "chromadb>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "openai>=1.0",
    "pypdf>=4.0",
]

[project.urls]
Repository = "https://github.com/s-matysik/EvidentiaSLR"
Issues = "https://github.com/s-matysik/EvidentiaSLR/issues"

[project.scripts]
evidentiaslr = "evidentiaslr.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidentiaslr = ["py.typed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a running external service (Qdrant, Postgres, GROBID)",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
